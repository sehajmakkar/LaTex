version: "3.8"

services:
  latex-compiler:
    build:
      context: .
      dockerfile: Dockerfile.texlive
    volumes:
      - ../tmp/compile:/data
    network_mode: none
    mem_limit: 512m
    cpus: 1
    read_only: true
    tmpfs:
      - /tmp:size=100m

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: latex
      POSTGRES_PASSWORD: latex
      POSTGRES_DB: latex_ai_editor
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
